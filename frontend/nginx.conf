server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend.
    # BACKEND_HOST is substituted at container startup by the nginx image's
    # envsubst step (see Dockerfile). It defaults to "backend" for local
    # docker-compose; on CapRover set it to "srv-captain--<backend-app-name>".
    # Using a variable + Docker's embedded DNS resolver means nginx does NOT
    # resolve the host at startup, so the SPA still serves even if the backend
    # is temporarily down (you get a 502 only on /api, not the whole site).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://${BACKEND_HOST}:8000;
        # $request_uri keeps the full original path (/api/courses, etc.).
        # Required because a variable in proxy_pass disables nginx's normal
        # prefix substitution — without this the path collapses to "/api/".
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (PDF)
        client_max_body_size 20M;

        # Longer timeout for model inference
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
